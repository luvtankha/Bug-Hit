server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful
  forward-headers-strategy: framework
spring:
  application.name: bug-hit
  lifecycle.timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./.local/bughit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari.maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  servlet.multipart:
    max-file-size: 5MB
    max-request-size: 6MB
management.endpoints.web.exposure.include: health
bughit:
  jwt-secret: ${JWT_SECRET:}
  live-origin: ${LIVE_ORIGIN:}
---
spring.config.activate.on-profile: render
spring.datasource.url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
server.address: 0.0.0.0
